[project]
name = "gnani-lecture-platform"
version = "0.1.0"
description = "Lecture-to-Learning Platform: Gnani Prisma STT -> structured notes -> grounded voice tutor on LiveKit Agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents==1.8.8",
    "livekit-plugins-gnani==1.8.8",
    "livekit-plugins-google==1.8.8",
    "livekit-plugins-groq==1.8.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=2.30.1",
    "websockets>=13",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "agent"]
